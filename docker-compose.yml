services:
  discovery:
    build: .
    container_name: discovery_service
    command: python discovery_service.py
    ports:
      - "8500:8500"
    environment:
      - PYTHONUNBUFFERED=1
      - DISCOVERY_PORT=8500
    restart: unless-stopped

  gateway:
    build: .
    container_name: gateway_service
    command: uvicorn gateway:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - DISCOVERY_URL=http://discovery:8500
    depends_on:
      - discovery
    restart: unless-stopped

  users:
    build: .
    container_name: users_service
    command: python subscriber_users.py
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - DISCOVERY_URL=http://discovery:8500
    depends_on:
      - discovery
    restart: unless-stopped

  payments:
    build: .
    container_name: payments_service
    command: python subscriber_payments.py
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - DISCOVERY_URL=http://discovery:8500
    depends_on:
      - discovery
    restart: unless-stopped

